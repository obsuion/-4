services:
  kaze:
    build:
      context: ..
      dockerfile: kit/Dockerfile
    image: kaze-b62-candidate
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ${KAZE_DATA:?set one shared absolute data directory}:/data
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    restart: "no"
    # No public ports. Docker stop is NOT a guaranteed checkpoint.
    command: ["doctor"]
